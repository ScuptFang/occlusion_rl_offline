<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>010 / 011 多随机位姿 · Agent 回放</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d1420; color: #eaf0f7; }
    .shell { max-width: 1500px; margin: auto; padding: 24px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    h1 { margin: 0 0 6px; font-size: clamp(24px, 3vw, 36px); font-weight: 650; letter-spacing: -.03em; }
    .sub, .hint { color: #a3b5c8; line-height: 1.5; }
    .sub { margin: 0; font-size: 14px; }
    .badge { border: 1px solid #35516c; color: #9bd3e8; border-radius: 999px; padding: 8px 12px; white-space: nowrap; font-size: 12px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, .8fr); gap: 16px; }
    .card { background: #151f2c; border: 1px solid #27384a; border-radius: 16px; overflow: hidden; }
    .stage { position: relative; min-height: 510px; background: radial-gradient(circle at 50% 46%, #203548 0%, #101b29 64%, #0e1723 100%); }
    #scene { display: block; width: 100%; height: 510px; touch-action: none; cursor: grab; }
    #scene:active { cursor: grabbing; }
    .stage-note { position: absolute; left: 17px; top: 15px; display: flex; gap: 12px; flex-wrap: wrap; padding: 9px 12px; border: 1px solid #35516c99; border-radius: 10px; background: #111c29d9; font-size: 12px; }
    .key { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .upper { background: #6be1ee; } .lower { background: #f8b89a; } .target { background: #8091a7; }
    .camera-hint { position: absolute; right: 16px; bottom: 14px; color: #b7c8d9; font-size: 12px; background: #111c29bb; padding: 7px 9px; border-radius: 8px; }
    .sample-hint { position: absolute; left: 16px; bottom: 14px; display: flex; gap: 10px; flex-wrap: wrap; color: #d0deea; font-size: 11px; background: #111c29d9; padding: 7px 9px; border-radius: 8px; }
    .controls { padding: 17px 19px 18px; border-top: 1px solid #27384a; }
    .control-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    select, button { color: #eaf0f7; background: #24364a; border: 1px solid #3e5970; border-radius: 9px; padding: 9px 12px; font: inherit; cursor: pointer; }
    button:hover, select:hover { border-color: #70c9df; }
    button.primary { background: #1a7890; border-color: #4bbbd2; font-weight: 600; min-width: 82px; }
    #step { width: 100%; accent-color: #65d8e8; margin: 17px 0 10px; cursor: pointer; }
    .timeline-label { display: flex; justify-content: space-between; color: #a7b9c9; font-size: 12px; }
    .side { padding: 22px; display: flex; flex-direction: column; gap: 20px; }
    .eyebrow { color: #87a6bf; font-size: 11px; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 7px; }
    .step-title { font-size: 25px; font-weight: 650; margin: 0; }
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric { background: #1b2a3a; padding: 14px; border-radius: 11px; min-height: 86px; }
    .metric .label { font-size: 12px; color: #a7b9ca; }
    .metric .value { display: block; font-size: 24px; font-weight: 650; margin-top: 7px; font-variant-numeric: tabular-nums; }
    .metric .delta { display: block; color: #92acbc; font-size: 12px; margin-top: 4px; }
    .status { border-radius: 10px; background: #28364a; padding: 10px 12px; font-size: 13px; color: #c3d4e4; }
    .status.success { background: #164439; color: #9de5c2; }
    .chart-wrap { border-top: 1px solid #314357; padding-top: 18px; }
    #chart { width: 100%; height: 160px; display: block; cursor: crosshair; }
    .chart-key { display: flex; gap: 16px; color: #a8bccb; font-size: 12px; }
    .action { background: #10202e; border: 1px solid #30485c; border-radius: 10px; padding: 12px; font-size: 13px; line-height: 1.7; font-variant-numeric: tabular-nums; }
    .hint { font-size: 12px; margin: 0; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .side { gap: 15px; } #scene, .stage { height: 440px; min-height: 440px; } header { align-items: start; flex-direction: column; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><h1 id="demo-title">多病例 Agent 轨迹</h1><p class="sub" id="demo-subtitle"></p></div>
      <div class="badge" id="demo-badge"></div>
    </header>
    <div class="layout">
      <section class="card">
        <div class="stage">
          <canvas id="scene" aria-label="上下颌三维点云回放"></canvas>
          <div class="stage-note">
            <span class="key"><i class="dot upper"></i> 当前上颌</span>
            <span class="key"><i class="dot lower"></i> 固定下颌</span>
            <span class="key"><i class="dot target"></i> 原始上颌目标</span>
          </div>
          <div class="camera-hint">拖动旋转视角 · 滚轮缩放</div>
          <div class="sample-hint"><span class="key"><i class="dot" style="background:#df648c"></i>穿透</span><span class="key"><i class="dot" style="background:#52d6a6"></i>接触</span><span class="key"><i class="dot" style="background:#50a9ea"></i>近接触</span><span class="key"><i class="dot" style="background:#ffc45d"></i>远离</span></div>
        </div>
        <div class="controls">
          <div class="control-row">
            <select id="case-filter" aria-label="筛选病例"></select>
            <select id="band-filter" aria-label="筛选扰动档位"></select>
            <select id="case" aria-label="选择随机位姿轨迹"></select>
            <button class="primary" id="play">▶ 播放</button>
            <button id="restart">回到起点</button>
            <label class="hint"><input type="checkbox" id="ghost" checked> 显示原始上颌</label>
            <label class="hint"><input type="checkbox" id="candidates" checked> 候选点</label>
            <label class="hint"><input type="checkbox" id="samples" checked> 网络实际输入点</label>
          </div>
          <input id="step" type="range" min="0" max="16" value="0" aria-label="调整动作步数">
          <div class="timeline-label"><span>随机扰动</span><span id="step-counter">0 / 16 步</span><span>最终姿态</span></div>
          <p class="hint" id="sample-stats" style="margin:10px 0 0"></p>
        </div>
      </section>
      <aside class="card side">
        <div><div class="eyebrow">当前动作</div><h2 class="step-title" id="step-title">初始扰动</h2></div>
        <div class="metric-grid">
          <div class="metric"><span class="label">旋转误差</span><span class="value" id="rotation">—</span><span class="delta" id="rotation-delta"></span></div>
          <div class="metric"><span class="label">平移误差</span><span class="value" id="translation">—</span><span class="delta" id="translation-delta"></span></div>
          <div class="metric"><span class="label">教师分数</span><span class="value" id="score">—</span><span class="delta">校准后分数</span></div>
          <div class="metric"><span class="label">已执行动作</span><span class="value" id="progress">—</span><span class="delta">单次推理轨迹</span></div>
        </div>
        <div class="status" id="status"></div>
        <div class="chart-wrap"><div class="eyebrow">误差变化</div><canvas id="chart"></canvas><div class="chart-key"><span class="key"><i class="dot upper"></i> 旋转 °</span><span class="key"><i class="dot lower"></i> 平移 mm</span></div></div>
        <div><div class="eyebrow">本步调整量</div><div class="action" id="action"></div></div>
        <p class="hint" id="sample-explanation"></p>
      </aside>
    </div>
  </main>
  <script src="./multi_pose_data.js"></script>
  <script>
  (() => {
    const data = window.DEMO_DATA;
    if (!data) { document.body.textContent = '缺少 multi_pose_data.js。请先运行 generate_multi_pose.py。'; return; }
    const $ = id => document.getElementById(id);
    $('demo-title').textContent = data.title;
    $('demo-subtitle').textContent = `${data.subtitle} PPO 动作全部执行，分数下降时也继续调整。`;
    $('demo-badge').textContent = `${data.trajectories.length} 条轨迹 · ${data.trajectories[0].steps.length - 1} 步回放`;
    const scene = $('scene'), chart = $('chart');
    const picker = $('case'), caseFilter = $('case-filter'), bandFilter = $('band-filter');
    const slider = $('step'), playButton = $('play');
    Object.keys(data.cases).forEach(id => {
      const option = document.createElement('option'); option.value = id; option.textContent = `病例 ${id}`; caseFilter.appendChild(option);
    });
    const bandKey = item => `${item.band.rotation_deg}_${item.band.translation_mm}`;
    data.trajectories.filter((item, i, all) => all.findIndex(other => bandKey(other) === bandKey(item)) === i).forEach(item => {
      const option = document.createElement('option'); option.value = bandKey(item);
      option.textContent = `±${item.band.rotation_deg}° / ±${item.band.translation_mm} mm`; bandFilter.appendChild(option);
    });
    const query = new URLSearchParams(location.search);
    const requestedCase = query.get('case');
    const requestedBand = query.get('band'), requestedEpisode = Number(query.get('episode') || 0);
    const selectedCase = data.trajectories.findIndex(item => item.case_id === requestedCase &&
      (!requestedBand || String(item.band.rotation_deg) === requestedBand) && item.test_episode_index === requestedEpisode);
    let caseIndex = selectedCase >= 0 ? selectedCase : Math.max(0, Math.min(data.trajectories.length - 1, Number(requestedCase) || 0));
    caseFilter.value = data.trajectories[caseIndex].case_id;
    bandFilter.value = bandKey(data.trajectories[caseIndex]);
    function fillPicker(preferred = caseIndex) {
      picker.replaceChildren();
      data.trajectories.forEach((item, i) => {
        if (item.case_id !== caseFilter.value || bandKey(item) !== bandFilter.value) return;
        const option = document.createElement('option'); option.value = i;
        option.textContent = `随机位姿 ${item.test_episode_index + 1} / 32`;
        picker.appendChild(option);
      });
      caseIndex = [...picker.options].some(option => Number(option.value) === preferred)
        ? preferred : Number(picker.options[0].value);
      picker.value = String(caseIndex);
    }
    fillPicker();
    let stepIndex = 0, playing = false, timer = null;
    let yaw = -.28, pitch = .68, zoom = 1;
    let pivot, upper, lower, candidateUpper, center, span, meshVertices;
    function loadGeometry() {
      const geometry = data.cases[data.trajectories[caseIndex].case_id];
      ({pivot, upper, lower, candidate_upper: candidateUpper, upper_mesh_vertices: meshVertices} = geometry);
      const scenePoints = upper.concat(lower);
      const mins = [0,1,2].map(i => Math.min(...scenePoints.map(p => p[i])));
      const maxs = [0,1,2].map(i => Math.max(...scenePoints.map(p => p[i])));
      center = mins.map((v,i) => (v + maxs[i]) / 2);
      span = maxs.map((v,i) => v - mins[i]);
      $('sample-explanation').textContent = `灰白点是 ${candidateUpper.length} 个均匀候选上颌顶点；彩色大点是当前步送入网络的 64 个距离加权 FPS 点。`;
    }
    loadGeometry();
    const traj = () => data.trajectories[caseIndex].steps;
    function sizeCanvas(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
      const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      return {w, h, dpr};
    }
    function project(x, y, z, w, h, scale) {
      x -= center[0]; y -= center[1]; z -= center[2];
      const x1 = Math.cos(yaw) * x - Math.sin(yaw) * y;
      const y1 = Math.sin(yaw) * x + Math.cos(yaw) * y;
      return [w / 2 + x1 * scale, h / 2 - (y1 * Math.cos(pitch) + z * Math.sin(pitch)) * scale,
              z * Math.cos(pitch) - y1 * Math.sin(pitch)];
    }
    function drawScene() {
      const {w, h, dpr} = sizeCanvas(scene);
      const ctx = scene.getContext('2d'); ctx.clearRect(0, 0, w, h);
      const scale = Math.min(w / (span[0] * 1.3), h / (Math.hypot(span[1], span[2]) * 1.5)) * zoom;
      const pose = traj()[stepIndex], r = pose.rotation, t = pose.translation;
      const dots = [];
      function add(points, kind, transformed) {
        for (let i = 0; i < points.length; i++) {
          const p = points[i]; let x = p[0], y = p[1], z = p[2];
          if (transformed) {
            const a = x - pivot[0], b = y - pivot[1], c = z - pivot[2];
            x = r[0]*a + r[1]*b + r[2]*c + pivot[0] + t[0];
            y = r[3]*a + r[4]*b + r[5]*c + pivot[1] + t[1];
            z = r[6]*a + r[7]*b + r[8]*c + pivot[2] + t[2];
          }
          const q = project(x, y, z, w, h, scale);
          dots.push([q[0], q[1], q[2], kind]);
        }
      }
      add(lower, 0, false);
      if ($('ghost').checked) add(upper, 1, false);
      add(upper, 2, true);
      if ($('candidates').checked) add(candidateUpper, 3, true);
      if ($('samples').checked) pose.selected_indices.forEach((id, i) => {
        const d = pose.selected_sdf[i];
        const kind = d < -.15 ? 4 : Math.abs(d) < .15 ? 5 : Math.abs(d) < .6 ? 6 : 7;
        if (pose.selected_points) add([pose.selected_points[i]], kind, false);
        else add([candidateUpper[id]], kind, true);
      });
      dots.sort((a, b) => (a[3] >= 4) - (b[3] >= 4) || a[2] - b[2]);
      const colors = ['#f7b99c', '#60798d', '#6be1ee', '#e8f3ff', '#df648c', '#52d6a6', '#50a9ea', '#ffc45d'];
      const radius = [1.7, 1.2, 1.8, 2.4, 6, 6, 6, 6].map(x => x * dpr);
      for (const dot of dots) {
        const [x, y, depth, kind] = dot;
        if (x < 0 || x > w || y < 0 || y > h) continue;
        ctx.globalAlpha = kind === 1 ? .32 : kind === 3 ? .8 : kind >= 4 ? 1 : Math.max(.48, Math.min(.93, .7 + depth / 80));
        ctx.fillStyle = colors[kind];
        const rr = radius[kind]; ctx.fillRect(x - rr / 2, y - rr / 2, rr, rr);
      }
      ctx.globalAlpha = 1;
    }
    function drawChart() {
      const {w, h, dpr} = sizeCanvas(chart), ctx = chart.getContext('2d');
      ctx.clearRect(0, 0, w, h);
      const steps = traj(), left = 12*dpr, right = w - 10*dpr, top = 14*dpr, bottom = h - 22*dpr;
      const maxR = Math.max(2, ...steps.map(s => s.rotation_error)) * 1.1;
      const maxT = Math.max(1, ...steps.map(s => s.translation_error)) * 1.1;
      ctx.strokeStyle = '#365066'; ctx.lineWidth = dpr;
      for (let i = 0; i < 4; i++) { const y = top + (bottom-top)*i/3; ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(right,y); ctx.stroke(); }
      function line(key, max, color) {
        ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2.5*dpr;
        steps.forEach((s,i) => { const x = left+(right-left)*i/(steps.length-1), y = bottom-(bottom-top)*s[key]/max;
          if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }); ctx.stroke();
        const p = steps[stepIndex]; const x = left+(right-left)*stepIndex/(steps.length-1), y=bottom-(bottom-top)*p[key]/max;
        ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,4*dpr,0,Math.PI*2); ctx.fill();
      }
      line('rotation_error', maxR, '#6be1ee'); line('translation_error', maxT, '#f7b99c');
      const x = left+(right-left)*stepIndex/(steps.length-1);
      ctx.strokeStyle='#e5f4ff88'; ctx.lineWidth=dpr; ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,bottom); ctx.stroke();
    }
    function setStep(value) {
      stepIndex = Math.max(0, Math.min(traj().length - 1, Number(value)));
      slider.max = traj().length - 1; slider.value = stepIndex;
      const s = traj()[stepIndex], initial = traj()[0];
      $('step-counter').textContent = `${stepIndex} / ${traj().length - 1} 步`;
      $('step-title').textContent = stepIndex ? `第 ${stepIndex} 步调整` : '初始随机扰动';
      $('rotation').textContent = `${s.rotation_error.toFixed(2)}°`;
      $('translation').textContent = `${s.translation_error.toFixed(2)} mm`;
      $('score').textContent = s.teacher_logit.toFixed(2);
      $('progress').textContent = `${stepIndex} / ${traj().length - 1}`;
      const close = s.selected_sdf.filter(d => Math.abs(d) < .6).length;
      const penetrating = s.selected_sdf.filter(d => d < 0).length;
      $('sample-stats').textContent = `当前网络输入：${s.selected_indices.length} / ${meshVertices} 个原网格顶点；${close} 点距下颌表面 < 0.6 mm，${penetrating} 点的带符号距离为负。`;
      $('rotation-delta').textContent = `起点 ${initial.rotation_error.toFixed(2)}°`;
      $('translation-delta').textContent = `起点 ${initial.translation_error.toFixed(2)} mm`;
      const threshold = data.success_threshold;
      const success = s.rotation_error <= threshold.rotation_deg && s.translation_error <= threshold.translation_mm;
      $('status').className = 'status' + (success ? ' success' : '');
      const gateText = !stepIndex ? '初始随机扰动。' : data.score_gated_actions
        ? (s.accepted_action ? '本步动作已接受；教师分数上升。' : '本步动作被拒绝；教师分数未上升，姿态保持不变。')
        : '本步动作已执行；教师分数可升可降。';
      $('status').textContent = `${gateText} ${success ? '达到' : '未达到'} ${threshold.rotation_deg}° / ${threshold.translation_mm} mm 恢复阈值。`;
      if (s.action) {
        const a = s.action;
        $('action').textContent = `${s.accepted_action ? '已接受' : '已拒绝'} · 提议旋转向量 [${a.slice(0,3).map(v => (v*data.action_rotation_step_deg).toFixed(2)).join(', ')}]° · 提议平移 [${a.slice(3).map(v => (v*data.action_translation_step_mm).toFixed(2)).join(', ')}] mm`;
      } else $('action').textContent = '尚未执行动作';
      drawScene(); drawChart();
    }
    function stop() { playing = false; clearInterval(timer); timer = null; playButton.textContent = '▶ 播放'; }
    function play() {
      if (playing) { stop(); return; }
      if (stepIndex >= traj().length - 1) setStep(0);
      playing = true; playButton.textContent = 'Ⅱ 暂停';
      timer = setInterval(() => { if (stepIndex >= traj().length - 1) { stop(); return; } setStep(stepIndex + 1); }, 600);
    }
    playButton.addEventListener('click', play);
    $('restart').addEventListener('click', () => { stop(); setStep(0); });
    $('ghost').addEventListener('change', drawScene);
    $('candidates').addEventListener('change', drawScene);
    $('samples').addEventListener('change', drawScene);
    picker.addEventListener('change', () => { stop(); caseIndex = Number(picker.value); loadGeometry(); setStep(0); });
    caseFilter.addEventListener('change', () => { stop(); fillPicker(); loadGeometry(); setStep(0); });
    bandFilter.addEventListener('change', () => { stop(); fillPicker(); loadGeometry(); setStep(0); });
    slider.addEventListener('input', () => { stop(); setStep(slider.value); });
    chart.addEventListener('click', e => { const rect = chart.getBoundingClientRect(); stop(); setStep(Math.round((e.clientX - rect.left) / rect.width * (traj().length - 1))); });
    let dragging = false, lastX = 0, lastY = 0;
    scene.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; scene.setPointerCapture(e.pointerId); });
    scene.addEventListener('pointerup', () => { dragging = false; });
    scene.addEventListener('pointermove', e => { if (!dragging) return; yaw += (e.clientX-lastX)*.009; pitch = Math.max(-1.5, Math.min(1.5, pitch+(e.clientY-lastY)*.009)); lastX=e.clientX; lastY=e.clientY; drawScene(); });
    scene.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(.5, Math.min(3, zoom*Math.exp(-e.deltaY*.001))); drawScene(); }, {passive:false});
    window.addEventListener('resize', () => { drawScene(); drawChart(); });
    window.addEventListener('keydown', e => { if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight') { stop(); setStep(stepIndex+1); }
      else if (e.key === 'ArrowLeft') { stop(); setStep(stepIndex-1); }
      else if (e.code === 'Space') { e.preventDefault(); play(); }
    });
    setStep(Number(query.get('step')) || 0);
  })();
  </script>
</body>
</html>
