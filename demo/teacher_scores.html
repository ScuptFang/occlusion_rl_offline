<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Teacher 位姿评分</title>  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d1420; color: #eaf0f7; }
    .shell { max-width: 1500px; margin: auto; padding: 24px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    h1 { margin: 0 0 6px; font-size: clamp(24px, 3vw, 36px); font-weight: 650; letter-spacing: -.03em; }
    .sub, .hint { color: #a3b5c8; line-height: 1.5; }
    .sub { margin: 0; font-size: 14px; }
    .badge { border: 1px solid #35516c; color: #9bd3e8; border-radius: 999px; padding: 8px 12px; white-space: nowrap; font-size: 12px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, .8fr); gap: 16px; }
    .card { background: #151f2c; border: 1px solid #27384a; border-radius: 16px; overflow: hidden; }
    .stage { position: relative; min-height: 510px; background: radial-gradient(circle at 50% 46%, #203548 0%, #101b29 64%, #0e1723 100%); }
    #scene { display: block; width: 100%; height: 510px; touch-action: none; cursor: grab; }
    #scene:active { cursor: grabbing; }
    .stage-note { position: absolute; left: 17px; top: 15px; display: flex; gap: 12px; flex-wrap: wrap; padding: 9px 12px; border: 1px solid #35516c99; border-radius: 10px; background: #111c29d9; font-size: 12px; }
    .key { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .upper { background: #6be1ee; } .lower { background: #f8b89a; } .target { background: #8091a7; }
    .camera-hint { position: absolute; right: 16px; bottom: 14px; color: #b7c8d9; font-size: 12px; background: #111c29bb; padding: 7px 9px; border-radius: 8px; }
    .sample-hint { position: absolute; left: 16px; bottom: 14px; display: flex; gap: 10px; flex-wrap: wrap; color: #d0deea; font-size: 11px; background: #111c29d9; padding: 7px 9px; border-radius: 8px; }
    .controls { padding: 17px 19px 18px; border-top: 1px solid #27384a; }
    .control-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    select, button { color: #eaf0f7; background: #24364a; border: 1px solid #3e5970; border-radius: 9px; padding: 9px 12px; font: inherit; cursor: pointer; }
    button:hover, select:hover { border-color: #70c9df; }
    button.primary { background: #1a7890; border-color: #4bbbd2; font-weight: 600; min-width: 82px; }
    #step { width: 100%; accent-color: #65d8e8; margin: 17px 0 10px; cursor: pointer; }
    .timeline-label { display: flex; justify-content: space-between; color: #a7b9c9; font-size: 12px; }
    .side { padding: 22px; display: flex; flex-direction: column; gap: 20px; }
    .eyebrow { color: #87a6bf; font-size: 11px; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 7px; }
    .step-title { font-size: 25px; font-weight: 650; margin: 0; }
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric { background: #1b2a3a; padding: 14px; border-radius: 11px; min-height: 86px; }
    .metric .label { font-size: 12px; color: #a7b9ca; }
    .metric .value { display: block; font-size: 24px; font-weight: 650; margin-top: 7px; font-variant-numeric: tabular-nums; }
    .metric .delta { display: block; color: #92acbc; font-size: 12px; margin-top: 4px; }
    .status { border-radius: 10px; background: #28364a; padding: 10px 12px; font-size: 13px; color: #c3d4e4; }
    .status.success { background: #164439; color: #9de5c2; }
    .chart-wrap { border-top: 1px solid #314357; padding-top: 18px; }
    #chart { width: 100%; height: 160px; display: block; cursor: crosshair; }
    .chart-key { display: flex; gap: 16px; color: #a8bccb; font-size: 12px; }
    .action { background: #10202e; border: 1px solid #30485c; border-radius: 10px; padding: 12px; font-size: 13px; line-height: 1.7; font-variant-numeric: tabular-nums; }
    .hint { font-size: 12px; margin: 0; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .side { gap: 15px; } #scene, .stage { height: 440px; min-height: 440px; } header { align-items: start; flex-direction: column; } }
  </style><main class="shell">
<header><div><h1>Teacher · 上颌位姿评分</h1><p class="sub">独立姿态实际推理 · 分数越高表示 teacher 越偏好该姿态</p></div><a href="optimized.html" style="color:#6be1ee">Agent 轨迹 →</a></header>
<div class="layout"><section class="card"><div class="stage"><canvas id="scene" aria-label="上下颌三维视图"></canvas><div class="stage-note">青色：当前上颌　橙色：下颌　灰色：原始上颌</div><div class="camera-hint">拖动旋转视角 · 滚轮缩放</div></div>
<div class="controls"><div class="control-row"><select id="case-filter" aria-label="病例"></select><select id="sweep" aria-label="姿态变化方向"></select><button id="restart">原始姿态</button><button id="best">本组最高分</button></div>
<input id="step" type="range" min="0" max="40" value="20" aria-label="选择预计算姿态"><div class="timeline-label"><span id="min"></span><span id="current"></span><span id="max"></span></div>
<p><label><input type="checkbox" id="ghost" checked>原始上颌</label> <label><input type="checkbox" id="candidates">4096 候选点</label> <label><input type="checkbox" id="samples" checked>64 个网络输入点</label></p><p class="hint" id="sample-stats"></p></div></section>
<aside class="card side"><div class="metric-grid"><div class="metric"><span class="label">当前 teacher 分数</span><strong class="value" id="score"></strong></div><div class="metric"><span class="label">相对原始姿态的分差</span><strong class="value" id="delta"></strong></div><div class="metric"><span class="label">旋转误差</span><strong class="value" id="rotation"></strong></div><div class="metric"><span class="label">平移误差</span><strong class="value" id="translation"></strong></div></div>
<div class="status" id="status"></div><div class="chart-wrap"><div class="eyebrow">Teacher 分数曲线 · 点击切换姿态</div><canvas id="chart" aria-label="姿态和教师分数曲线"></canvas><p class="hint">青线：实际分数；橙色虚线：原始姿态分数。随机组按样本序号排列，连线仅便于浏览。</p></div><div class="action" id="pose"></div><p class="hint">旋转向量以原上颌顶点中心为旋转中心，XYZ 为数据坐标轴。曲线为离线真实推理结果，没有插值评分。分数不是成功概率，也不保证与姿态误差单调对应。</p><p class="hint" id="source" style="overflow-wrap:anywhere"></p></aside></div></main>
<script src="teacher_scores_data.js"></script><script>
(()=>{const data=window.DEMO_DATA, $=id=>document.getElementById(id);
if(!data){document.body.textContent='请先生成 teacher_scores_data.js';return;}
const scene=$('scene'),chart=$('chart');let caseIndex=0,stepIndex=20,yaw=-.28,pitch=.68,zoom=1;
let pivot,upper,lower,candidateUpper,center,span,meshVertices;
const traj=()=>data.trajectories[caseIndex].steps;
Object.keys(data.cases).sort().forEach(id=>{let o=document.createElement('option');o.value=id;o.textContent=`病例 ${id} · ${data.cases[id].split}`;$('case-filter').appendChild(o);});
$('case-filter').value=data.cases['010']?'010':Object.keys(data.cases)[0];
function loadGeometry(){const g=data.cases[$('case-filter').value];({pivot,upper,lower,candidate_upper:candidateUpper,upper_mesh_vertices:meshVertices}=g);const ps=upper.concat(lower);const lo=[0,1,2].map(i=>Math.min(...ps.map(p=>p[i]))),hi=[0,1,2].map(i=>Math.max(...ps.map(p=>p[i])));center=lo.map((v,i)=>(v+hi[i])/2);span=lo.map((v,i)=>hi[i]-v);}
function chooseCase(){let old=$('sweep').selectedIndex;$('sweep').replaceChildren();data.trajectories.forEach((t,i)=>{if(t.case_id!==$('case-filter').value)return;let o=document.createElement('option');o.value=i;o.textContent=t.name;$('sweep').appendChild(o);});$('sweep').selectedIndex=Math.max(0,old);loadGeometry();chooseSweep();}
function chooseSweep(){caseIndex=Number($('sweep').value);setStep(data.trajectories[caseIndex].reference_index);}
    function sizeCanvas(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
      const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      return {w, h, dpr};
    }
    function project(x, y, z, w, h, scale) {
      x -= center[0]; y -= center[1]; z -= center[2];
      const x1 = Math.cos(yaw) * x - Math.sin(yaw) * y;
      const y1 = Math.sin(yaw) * x + Math.cos(yaw) * y;
      return [w / 2 + x1 * scale, h / 2 - (y1 * Math.cos(pitch) + z * Math.sin(pitch)) * scale,
              z * Math.cos(pitch) - y1 * Math.sin(pitch)];
    }
    function drawScene() {
      const {w, h, dpr} = sizeCanvas(scene);
      const ctx = scene.getContext('2d'); ctx.clearRect(0, 0, w, h);
      const scale = Math.min(w / (span[0] * 1.3), h / (Math.hypot(span[1], span[2]) * 1.5)) * zoom;
      const pose = traj()[stepIndex], r = pose.rotation, t = pose.translation;
      const dots = [];
      function add(points, kind, transformed) {
        for (let i = 0; i < points.length; i++) {
          const p = points[i]; let x = p[0], y = p[1], z = p[2];
          if (transformed) {
            const a = x - pivot[0], b = y - pivot[1], c = z - pivot[2];
            x = r[0]*a + r[1]*b + r[2]*c + pivot[0] + t[0];
            y = r[3]*a + r[4]*b + r[5]*c + pivot[1] + t[1];
            z = r[6]*a + r[7]*b + r[8]*c + pivot[2] + t[2];
          }
          const q = project(x, y, z, w, h, scale);
          dots.push([q[0], q[1], q[2], kind]);
        }
      }
      add(lower, 0, false);
      if ($('ghost').checked) add(upper, 1, false);
      add(upper, 2, true);
      if ($('candidates').checked) add(candidateUpper, 3, true);
      if ($('samples').checked) pose.selected_indices.forEach((id, i) => {
        const d = pose.selected_sdf[i];
        const kind = d < -.15 ? 4 : Math.abs(d) < .15 ? 5 : Math.abs(d) < .6 ? 6 : 7;
        if (pose.selected_points) add([pose.selected_points[i]], kind, false);
        else add([candidateUpper[id]], kind, true);
      });
      dots.sort((a, b) => (a[3] >= 4) - (b[3] >= 4) || a[2] - b[2]);
      const colors = ['#f7b99c', '#60798d', '#6be1ee', '#e8f3ff', '#df648c', '#52d6a6', '#50a9ea', '#ffc45d'];
      const radius = [1.7, 1.2, 1.8, 2.4, 6, 6, 6, 6].map(x => x * dpr);
      for (const dot of dots) {
        const [x, y, depth, kind] = dot;
        if (x < 0 || x > w || y < 0 || y > h) continue;
        ctx.globalAlpha = kind === 1 ? .32 : kind === 3 ? .8 : kind >= 4 ? 1 : Math.max(.48, Math.min(.93, .7 + depth / 80));
        ctx.fillStyle = colors[kind];
        const rr = radius[kind]; ctx.fillRect(x - rr / 2, y - rr / 2, rr, rr);
      }
      ctx.globalAlpha = 1;
    }

function drawChart(){const {w,h,dpr}=sizeCanvas(chart),c=chart.getContext('2d');c.clearRect(0,0,w,h);const ss=traj(),ref=data.cases[$('case-filter').value].reference_score;let lo=Math.min(ref,...ss.map(s=>s.teacher_logit)),hi=Math.max(ref,...ss.map(s=>s.teacher_logit));let pad=Math.max(.01,(hi-lo)*.15);lo-=pad;hi+=pad;const x=i=>50*dpr+(w-60*dpr)*i/(ss.length-1),y=v=>h-25*dpr-(h-40*dpr)*(v-lo)/(hi-lo);c.font=`${11*dpr}px sans-serif`;for(let i=0;i<4;i++){let v=lo+(hi-lo)*i/3;c.fillStyle='#a7b9ca';c.fillText(v.toFixed(2),0,y(v));c.strokeStyle='#30485c';c.beginPath();c.moveTo(x(0),y(v));c.lineTo(x(ss.length-1),y(v));c.stroke();}c.strokeStyle='#f8b89a';c.setLineDash([5*dpr,4*dpr]);c.beginPath();c.moveTo(x(0),y(ref));c.lineTo(x(ss.length-1),y(ref));c.stroke();c.setLineDash([]);c.strokeStyle='#6be1ee';c.lineWidth=2*dpr;c.beginPath();ss.forEach((s,i)=>i?c.lineTo(x(i),y(s.teacher_logit)):c.moveTo(x(i),y(s.teacher_logit)));c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(x(stepIndex),y(ss[stepIndex].teacher_logit),4*dpr,0,7);c.fill();}
function setStep(i){stepIndex=Math.max(0,Math.min(traj().length-1,Number(i)));let t=data.trajectories[caseIndex],s=traj()[stepIndex],g=data.cases[t.case_id],diff=s.teacher_logit-g.reference_score; $('step').max=traj().length-1;$('step').value=stepIndex;$('score').textContent=s.teacher_logit.toFixed(4);$('delta').textContent=(diff>=0?'+':'')+diff.toFixed(4);$('rotation').textContent=s.rotation_error.toFixed(3)+'°';$('translation').textContent=s.translation_error.toFixed(3)+' mm';$('min').textContent=traj()[0].value+t.unit;$('max').textContent=traj().at(-1).value+t.unit;$('current').textContent=t.name+'：'+s.value.toFixed(2)+t.unit;let best=traj().reduce((a,b)=>a.teacher_logit>b.teacher_logit?a:b);$('status').textContent=`原始分数 ${g.reference_score.toFixed(4)}；本组最高 ${best.teacher_logit.toFixed(4)}（${best.value.toFixed(2)}${t.unit}）。`;$('pose').textContent=`旋转向量 [${s.rotvec.map(v=>v.toFixed(2)).join(', ')}]°；平移 [${s.translation.map(v=>v.toFixed(2)).join(', ')}] mm`;$('sample-stats').textContent=`彩色点为当前姿态实际输入：${s.selected_indices.length} 个原网格顶点；距下颌最近顶点 < 0.6 mm：${s.selected_sdf.filter(d=>Math.abs(d)<.6).length} 个。粉：负距离；绿：接触；蓝：近接触；黄：远离。`;$('source').textContent='模型：'+data.teacher_checkpoint+'；SHA256：'+data.teacher_sha256;drawScene();drawChart();}
$('case-filter').onchange=chooseCase;$('sweep').onchange=chooseSweep;$('step').oninput=e=>setStep(e.target.value);$('restart').onclick=()=>setStep(data.trajectories[caseIndex].reference_index);$('best').onclick=()=>setStep(traj().reduce((b,s,i)=>s.teacher_logit>traj()[b].teacher_logit?i:b,0));['ghost','candidates','samples'].forEach(id=>$(id).onchange=drawScene);chart.onclick=e=>{let r=chart.getBoundingClientRect();setStep(Math.round((e.clientX-r.left-50)/(r.width-60)*(traj().length-1)));};
    let dragging = false, lastX = 0, lastY = 0;
    scene.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; scene.setPointerCapture(e.pointerId); });
    scene.addEventListener('pointerup', () => { dragging = false; });
    scene.addEventListener('pointermove', e => { if (!dragging) return; yaw += (e.clientX-lastX)*.009; pitch = Math.max(-1.5, Math.min(1.5, pitch+(e.clientY-lastY)*.009)); lastX=e.clientX; lastY=e.clientY; drawScene(); });
    scene.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(.5, Math.min(3, zoom*Math.exp(-e.deltaY*.001))); drawScene(); }, {passive:false});

window.addEventListener('resize',()=>{drawScene();drawChart();});chooseCase();})();</script></html>
