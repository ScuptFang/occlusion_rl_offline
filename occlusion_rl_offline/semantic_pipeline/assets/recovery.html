<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>咬合 Pipeline 可视化</title><link rel="stylesheet" href="recovery.css">
<main><nav class="links"><a href="index.html">语义分割</a><a href="teacher.html">Teacher 评分</a><a href="agent.html">Agent 轨迹</a></nav>
<header><div><h1 id="title"></h1><p id="subtitle"></p></div><span id="badge"></span></header><p id="warning"></p>
<div class="filters"><label>病例<select id="case"></select></label><label id="mode-label">测试入口<select id="mode"></select></label><label id="policy-label">策略<select id="policy"></select></label><label><span id="series-label">扰动档</span><select id="series"></select></label><label id="episode-label">起点<select id="episode"></select></label></div>
<section class="layout"><article><canvas id="view" aria-label="上下颌三维视图"></canvas><div class="legend"><span><i style="background:#52d4d0"></i>移动上颌</span><span><i style="background:#e5ae8f"></i>固定下颌</span><span><i style="background:#728397"></i>原始目标（仅对照）</span><span><i style="background:#ffd16e"></i>实际网络输入</span></div>
<div class="controls"><button id="play">▶ 播放</button><button id="first">回到起点</button><button id="prev">上一步</button><button id="next">下一步</button><label>速度<select id="speed"><option value="900">正常</option><option value="300">快速</option><option value="1500">慢速</option></select></label><button id="compare">切换同起点策略</button></div>
<input id="step" aria-label="姿态步数" type="range" min="0" max="1" value="0"><div class="between"><span id="step-label"></span><span id="range-label"></span></div>
<div class="controls secondary"><button data-camera="front">正面</button><button data-camera="side">侧面</button><button data-camera="top">咬合面</button><button data-camera="oblique">斜视</button><label><input id="ghost" type="checkbox" checked>目标对照</label><label><input id="inputs" type="checkbox" checked>输入点</label><label><input id="context" type="checkbox">完整模型背景</label><label><input id="wire" type="checkbox" checked>三角网格</label></div><p id="geometry-info" class="muted"></p><p class="muted">拖动旋转视角 · 滚轮缩放 · 图表可点击跳到对应姿态。页面只回放真实计算的离散帧，不插值伪造评分。</p></article>
<aside><h2 id="frame-title"></h2><div id="metrics" class="metrics"></div><p id="delta"></p><div id="action"></div><h3 id="chart-title">Teacher 分数</h3><canvas id="scores" class="chart"></canvas><div id="score-legend" class="legend"></div><h3>姿态误差</h3><canvas id="errors" class="chart"></canvas><div class="legend"><span><i style="background:#52d4d0"></i>旋转 °</span><span><i style="background:#e5ae8f"></i>平移 mm</span></div></aside></section>
<section id="training"><h2>RL 训练中的奖励权重</h2><p class="muted">横轴为训练轮次，与上方推理步数不同。推理时没有专家轨迹奖励。</p><canvas id="weights" class="chart"></canvas><div class="legend"><span><i style="background:#b9a1ff"></i>专家轨迹权重</span><span><i style="background:#52d4d0"></i>Teacher 权重</span></div><p id="training-info"></p></section>
<footer id="provenance"></footer></main><script src="__KIND___data.js"></script><script src="recovery.js"></script></html>
